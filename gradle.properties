# Project-wide Gradle settings.
# ─────────────────────────────────────────────────────────────────────────────

# JVM heap size for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable Gradle parallel builds
org.gradle.parallel=true

# Enable Gradle configuration cache for faster subsequent builds
org.gradle.configuration-cache=false

# Enable build cache
org.gradle.caching=true

# AndroidX — use modern Jetpack libraries
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Suppress non-transitive R class warnings
android.nonTransitiveRClass=true

# Enable R8 full mode for better dead code elimination in release
android.enableR8.fullMode=false

# Enabled parallel sync for Gradle 9.4+
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
